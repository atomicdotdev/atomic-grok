schema = 1
agent = "grok"
version = "1.0.0"

[requires]
atomic = ">=0.12.0"

[skills-source]
package = "atomic-skills"

[skills]
install = "all"
dst_pattern = "~/.grok/skills/{name}/SKILL.md"

[[skill]]
src = "AGENTS.md"
dst = "~/.grok/rules/atomic.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[[settings]]
manifest = "hooks/grok.atomic-hooks.json"
